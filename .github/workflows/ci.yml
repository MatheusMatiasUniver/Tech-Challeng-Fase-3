name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npx vitest run

      - run: npx playwright install --with-deps chromium

      # crud.spec.ts precisa da API real (Docker da Fase 2) e roda só localmente;
      # aqui vao os testes que mockam a API (page.route).
      - run: npx playwright test e2e/app.spec.ts e2e/regressions.spec.ts

      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - run: npm run build

      - run: docker build -t tech-challenge-fase-3 .
